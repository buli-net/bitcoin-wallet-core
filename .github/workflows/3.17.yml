name: Build Bitcoin Wallet v3.17
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SKIP_JDK_VERSION_CHECK: "true"
  ANDROID_HOME: /usr/local/lib/android/sdk
  MAVEN_HOME: /opt/maven-3.0.5
  PATH: /opt/maven-3.0.5/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK v3.17
    runs-on: ubuntu-latest
    steps:
      - name: Lấy toàn bộ mã nguồn
        uses: actions/checkout@v4
        with:
          repository: buli-net/test-B-Wallet
          fetch-depth: 0

      - name: Checkout đúng commit 982c631
        run: git checkout 982c631

      - name: Xác nhận commit hiện tại
        run: git log --oneline -1

      - name: Cài đặt Java 17 (cho sdkmanager)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cài đặt Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "tools" \
            "platform-tools" \
            "build-tools;26.0.3" \
            "platforms;android-26"

      - name: Tải sdklib 22.0.2 + tạo script apkbuilder tương thích
        run: |
          # Tải sdklib.jar phiên bản 22.0.2 (năm 2013, có ApkBuilderMain)
          mkdir -p /opt/android-tools-legacy
          wget -q https://repo1.maven.org/maven2/com/android/tools/sdklib/22.0.2/sdklib-22.0.2.jar -O /opt/android-tools-legacy/sdklib-22.0.2.jar
          
          # Tải các dependency cần thiết cho sdklib 22.0.2
          wget -q https://repo1.maven.org/maven2/com/android/tools/common/22.0.2/common-22.0.2.jar -O /opt/android-tools-legacy/common-22.0.2.jar
          wget -q https://repo1.maven.org/maven2/com/android/tools/build/builder/0.4.2/builder-0.4.2.jar -O /opt/android-tools-legacy/builder-0.4.2.jar
          wget -q https://repo1.maven.org/maven2/com/google/guava/guava/13.0.1/guava-13.0.1.jar -O /opt/android-tools-legacy/guava-13.0.1.jar
          
          # Tạo script apkbuilder
          cat > $ANDROID_HOME/tools/apkbuilder << 'APKBUILDER_EOF'
          #!/bin/bash
          LEGACY_LIBS="/opt/android-tools-legacy"
          CLASSPATH="$LEGACY_LIBS/sdklib-22.0.2.jar:$LEGACY_LIBS/common-22.0.2.jar:$LEGACY_LIBS/builder-0.4.2.jar:$LEGACY_LIBS/guava-13.0.1.jar"
          exec java -classpath "$CLASSPATH" com.android.sdklib.build.ApkBuilderMain "$@"
          APKBUILDER_EOF
          
          chmod +x $ANDROID_HOME/tools/apkbuilder
          echo "=== apkbuilder đã tạo ==="
          ls -la $ANDROID_HOME/tools/apkbuilder

      - name: Chuyển về Java 8 (cho biên dịch dự án)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Cài đặt Maven 3.0.5 + cấu hình HTTPS
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.0.5/binaries/apache-maven-3.0.5-bin.tar.gz
          tar -xzf apache-maven-3.0.5-bin.tar.gz -C /opt/
          mv /opt/apache-maven-3.0.5 /opt/maven-3.0.5
          
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <profiles>
              <profile>
                <id>https-central</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>https-central</activeProfile>
            </activeProfiles>
          </settings>
          EOF
          
          mvn --version

      - name: Clone và build bitcoinj 0.10.1
        run: |
          git clone --depth 1 --branch v0.10.1 https://github.com/bitcoinj/bitcoinj.git /tmp/bitcoinj
          cd /tmp/bitcoinj
          mvn clean install -DskipTests -q
          cd $GITHUB_WORKSPACE

      - name: Biên dịch toàn bộ dự án
        run: mvn clean install -q

      - name: Tìm file APK đã tạo
        run: |
          echo "=== Tìm tất cả file .apk ==="
          find . -name "*.apk" -type f

      - name: Lưu APK ra kết quả
        uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Wallet-v3.17-APK
          path: "**/*.apk"
          retention-days: 7
