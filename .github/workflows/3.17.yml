name: Build Bitcoin Wallet v3.17
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SKIP_JDK_VERSION_CHECK: "true"

on:
  workflow_dispatch: # Chỉ chạy thủ công, không tự động chạy

jobs:
  build:
    name: Build APK v3.17
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          ref: 982c631 # Commit bản 3.17 bạn đang dùng

      - name: Cài đặt Java 8 (bản 3.17 yêu cầu đúng JDK 8)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Cài đặt Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 5.0
          accept-android-sdk-licenses: true
          packages: tools platform-tools build-tools;26.0.3 platforms;android-26
          log-accepted-android-sdk-licenses: true

      - name: Cấp quyền thực thi
        run: |
          chmod +x wallet/gradlew
          chmod +x ./*

      - name: Biên dịch toàn bộ dự án bằng Maven
        run: mvn clean install --batch-mode --no-transfer-progress

      - name: Biên dịch APK cuối cùng
        run: cd wallet && ./gradlew clean assembleProdRelease --stacktrace --no-daemon

      - name: Lưu APK ra kết quả
        uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Wallet-v3.17-APK
          path: wallet/build/outputs/apk/prod/release/*.apk
          retention-days: 7
