name: Build Bitcoin Wallet v3.17
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SKIP_JDK_VERSION_CHECK: "true"
  ANDROID_HOME: /usr/local/lib/android/sdk
  MAVEN_HOME: /opt/maven-3.0.5
  PATH: /opt/maven-3.0.5/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK v3.17
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: buli-net/test-B-Wallet
          fetch-depth: 0

      - name: Checkout commit 982c631
        run: git checkout 982c631

      - name: Fix AndroidManifest targetSdk
        run: |
          if grep -q "<uses-sdk" wallet/AndroidManifest.xml; then
            sed -i 's/<uses-sdk\([^>]*\)>/<uses-sdk\1 android:targetSdkVersion="26">/g' wallet/AndroidManifest.xml
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "tools" "platform-tools" \
            "build-tools;26.0.3" "build-tools;33.0.2" \
            "platforms;android-14" "platforms;android-26" "platforms;android-33"
          rm -rf $ANDROID_HOME/platforms/android-3[4-9]*

      - name: Create fake apkbuilder
        run: |
          cat > $ANDROID_HOME/tools/apkbuilder << 'EOF'
          #!/bin/bash
          [ -n "$*" ] && touch "${*: -1}"
          exit 0
          EOF
          chmod +x $ANDROID_HOME/tools/apkbuilder

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Install Maven
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.0.5/binaries/apache-maven-3.0.5-bin.tar.gz
          tar -xzf apache-maven-3.0.5-bin.tar.gz -C /opt
          mv /opt/apache-maven-3.0.5 /opt/maven-3.0.5
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <profiles>
              <profile>
                <id>central</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>central</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Build bitcoinj
        run: |
          git clone --depth 1 --branch v0.10.1 https://github.com/bitcoinj/bitcoinj.git /tmp/bitcoinj
          cd /tmp/bitcoinj
          mvn clean install -DskipTests -q

      - name: Build project
        run: mvn clean install -pl :base,:integration-android,:wallet -am -q

      - name: Package & sign APK
        run: |
          BUILD26="$ANDROID_HOME/build-tools/26.0.3"
          BUILD33="$ANDROID_HOME/build-tools/33.0.2"
          DX="$BUILD26/dx"
          ZIPALIGN="$BUILD33/zipalign"
          SIGNER="$BUILD33/apksigner"

          AP_RAW="wallet/target/wallet-3.17-test.ap_"
          CLS_DIR="wallet/target/classes"
          OUT_APK="wallet/target/wallet-3.17-test.apk"
          WORK="/tmp/apk-build"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          DEPS=$(find ~/.m2/repository -name "*.jar" | grep -E "(bitcoinj-0\.10\.1|netty-3\.6\.3|protobuf-java-2\.4\.1|guava-13\.0\.1|scrypt-1\.3\.3|slf4j-api|logback-android)" | grep -v sources | grep -v examples)
          $DX --dex --output="$WORK/classes.dex" "$CLS_DIR" $DEPS

          cd "$WORK"
          unzip -q "$GITHUB_WORKSPACE/$AP_RAW"
          cp "$WORK/classes.dex" .
          zip -qr "$GITHUB_WORKSPACE/unsigned.apk" .

          cd "$GITHUB_WORKSPACE"
          $ZIPALIGN -f 4 unsigned.apk aligned.apk

          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -noprompt -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          $SIGNER sign --ks ~/.android/debug.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out "$OUT_APK" aligned.apk

          ls -la "$OUT_APK"
          $SIGNER verify --verbose "$OUT_APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Wallet-v3.17-APK
          path: wallet/target/wallet-3.17-test.apk
          retention-days: 7
