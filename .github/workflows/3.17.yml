name: Build Bitcoin Wallet v3.17
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SKIP_JDK_VERSION_CHECK: "true"
  ANDROID_HOME: /usr/local/lib/android/sdk
  MAVEN_HOME: /opt/maven-3.0.5
  PATH: /opt/maven-3.0.5/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK v3.17
    runs-on: ubuntu-latest
    steps:
      - name: Lấy toàn bộ mã nguồn
        uses: actions/checkout@v4
        with:
          repository: buli-net/test-B-Wallet
          fetch-depth: 0

      - name: Checkout đúng commit 982c631
        run: git checkout 982c631

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cài đặt Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "tools" \
            "platform-tools" \
            "build-tools;26.0.3" \
            "build-tools;33.0.2" \
            "platforms;android-14" \
            "platforms;android-26" \
            "platforms;android-33"
          
          echo "=== Platforms đã cài ==="
          ls $ANDROID_HOME/platforms/

      - name: Cài đặt apktool (từ GitHub releases)
        run: |
          # Tải script apktool
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          
          # Tải apktool.jar từ GitHub releases
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          chmod +x /usr/local/bin/apktool.jar
          
          # Kiểm tra
          apktool --version

      - name: Tạo script apkbuilder giả
        run: |
          cat > $ANDROID_HOME/tools/apkbuilder << 'APKBUILDER_EOF'
          #!/bin/bash
          OUTPUT_APK=""
          while [[ $# -gt 0 ]]; do
            case "$1" in
              /*.apk) OUTPUT_APK="$1"; shift;;
              *) shift;;
            esac
          done
          if [ -n "$OUTPUT_APK" ]; then
            touch "$OUTPUT_APK"
            echo "apkbuilder (fake): created placeholder $OUTPUT_APK" >&2
          fi
          exit 0
          APKBUILDER_EOF
          chmod +x $ANDROID_HOME/tools/apkbuilder

      - name: Chuyển về Java 8 (cho Maven build)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Cài đặt Maven 3.0.5 + cấu hình HTTPS
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.0.5/binaries/apache-maven-3.0.5-bin.tar.gz
          tar -xzf apache-maven-3.0.5-bin.tar.gz -C /opt/
          mv /opt/apache-maven-3.0.5 /opt/maven-3.0.5
          
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <profiles>
              <profile>
                <id>https-central</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>https-central</activeProfile>
            </activeProfiles>
          </settings>
          EOF
          
          mvn --version

      - name: Clone và build bitcoinj 0.10.1
        run: |
          git clone --depth 1 --branch v0.10.1 https://github.com/bitcoinj/bitcoinj.git /tmp/bitcoinj
          cd /tmp/bitcoinj
          mvn clean install -DskipTests -q
          cd $GITHUB_WORKSPACE

      - name: Build base + integration-android + wallet
        run: |
          mvn clean install -pl :base,:integration-android,:wallet -am -q

      - name: Đóng gói APK ban đầu
        run: |
          AAPT="$ANDROID_HOME/build-tools/26.0.3/aapt"
          APK_INPUT="wallet/target/wallet-3.17-test.ap_"
          DEX_FILE="wallet/target/classes.dex"
          TEMP_APK="wallet/target/wallet-3.17-test-temp.apk"
          
          cp "$APK_INPUT" "$TEMP_APK"
          $AAPT add "$TEMP_APK" "$DEX_FILE"
          
          ls -la "$TEMP_APK"

      - name: Chuyển về Java 17 (cho apktool + apksigner)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Sửa targetSdkVersion bằng apktool + đóng gói lại
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/33.0.2"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APK_SIGNER="$BUILD_TOOLS/apksigner"
          TEMP_APK="wallet/target/wallet-3.17-test-temp.apk"
          DECODED_DIR="/tmp/wallet-decoded"
          REBUILT_APK="wallet/target/wallet-3.17-test-rebuilt.apk"
          ALIGNED_APK="wallet/target/wallet-3.17-test-aligned.apk"
          SIGNED_APK="wallet/target/wallet-3.17-test.apk"
          
          # 1. Giải nén APK bằng apktool
          apktool d -f "$TEMP_APK" -o "$DECODED_DIR"
          
          # 2. Sửa AndroidManifest.xml: thêm/nâng targetSdkVersion lên 33
          echo "=== Manifest trước khi sửa ==="
          grep -n "sdkVersion\|targetSdkVersion\|minSdkVersion" "$DECODED_DIR/AndroidManifest.xml" || true
          
          if grep -q "android:targetSdkVersion" "$DECODED_DIR/AndroidManifest.xml"; then
            sed -i 's/android:targetSdkVersion="[0-9]*"/android:targetSdkVersion="33"/g' "$DECODED_DIR/AndroidManifest.xml"
          else
            sed -i 's/android:minSdkVersion="\([0-9]*\)"/android:minSdkVersion="\1" android:targetSdkVersion="33"/g' "$DECODED_DIR/AndroidManifest.xml"
          fi
          
          echo ""
          echo "=== Manifest sau khi sửa ==="
          grep -n "sdkVersion\|targetSdkVersion\|minSdkVersion" "$DECODED_DIR/AndroidManifest.xml"
          
          # 3. Đóng gói lại bằng apktool
          apktool b -f "$DECODED_DIR" -o "$REBUILT_APK"
          
          # 4. Zipalign
          $ZIPALIGN -f -v 4 "$REBUILT_APK" "$ALIGNED_APK"
          
          # 5. Tạo debug keystore
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # 6. Ký bằng apksigner (v1 + v2 scheme)
          $APK_SIGNER sign --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          
          # 7. Xác minh
          echo ""
          echo "=== Kết quả cuối cùng ==="
          ls -la "$SIGNED_APK"
          echo ""
          echo "=== Xác minh chữ ký ==="
          $APK_SIGNER verify --verbose "$SIGNED_APK"

      - name: Tìm file APK cuối cùng
        run: |
          echo "=== Tìm tất cả file .apk ==="
          find . -name "*.apk" -type f -size +0k

      - name: Lưu APK ra kết quả
        uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Wallet-v3.17-APK
          path: "wallet/target/wallet-3.17-test.apk"
          retention-days: 7
