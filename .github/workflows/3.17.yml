name: Build Bitcoin Wallet v3.17
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SKIP_JDK_VERSION_CHECK: "true"
  ANDROID_HOME: /usr/local/lib/android/sdk
  MAVEN_HOME: /opt/maven-3.0.5
  PATH: /opt/maven-3.0.5/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK v3.17
    runs-on: ubuntu-latest
    steps:
      - name: Lấy toàn bộ mã nguồn
        uses: actions/checkout@v4
        with:
          repository: buli-net/test-B-Wallet
          fetch-depth: 0

      - name: Checkout đúng commit 982c631
        run: git checkout 982c631

      - name: Sửa AndroidManifest.xml thêm targetSdkVersion
        run: |
          echo "=== Manifest gốc ==="
          cat wallet/AndroidManifest.xml
          echo ""
          
          # Thêm android:targetSdkVersion="26" vào thẻ <uses-sdk>
          # build-tools 26.0.3 hỗ trợ tối đa API 26
          if grep -q "<uses-sdk" wallet/AndroidManifest.xml; then
            sed -i 's/<uses-sdk\([^>]*\)>/<uses-sdk\1 android:targetSdkVersion="26">/g' wallet/AndroidManifest.xml
          else
            # Thêm thẻ uses-sdk nếu chưa có
            sed -i 's/<manifest/<manifest android:targetSdkVersion="26"/g' wallet/AndroidManifest.xml
          fi
          
          echo "=== Manifest sau khi sửa ==="
          cat wallet/AndroidManifest.xml

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cài đặt Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "tools" \
            "platform-tools" \
            "build-tools;26.0.3" \
            "build-tools;33.0.2" \
            "platforms;android-14" \
            "platforms;android-26"
          
          # Xóa các platform khác để Maven không chọn nhầm
          rm -rf $ANDROID_HOME/platforms/android-3*
          echo "=== Platforms còn lại ==="
          ls $ANDROID_HOME/platforms/

      - name: Tạo script apkbuilder giả
        run: |
          cat > $ANDROID_HOME/tools/apkbuilder << 'APKBUILDER_EOF'
          #!/bin/bash
          OUTPUT_APK=""
          while [[ $# -gt 0 ]]; do
            case "$1" in
              /*.apk) OUTPUT_APK="$1"; shift;;
              *) shift;;
            esac
          done
          if [ -n "$OUTPUT_APK" ]; then
            touch "$OUTPUT_APK"
            echo "apkbuilder (fake): created placeholder $OUTPUT_APK" >&2
          fi
          exit 0
          APKBUILDER_EOF
          chmod +x $ANDROID_HOME/tools/apkbuilder

      - name: Chuyển về Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Cài đặt Maven 3.0.5 + cấu hình HTTPS
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.0.5/binaries/apache-maven-3.0.5-bin.tar.gz
          tar -xzf apache-maven-3.0.5-bin.tar.gz -C /opt/
          mv /opt/apache-maven-3.0.5 /opt/maven-3.0.5
          
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <profiles>
              <profile>
                <id>https-central</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>https-central</activeProfile>
            </activeProfiles>
          </settings>
          EOF
          
          mvn --version

      - name: Clone và build bitcoinj 0.10.1
        run: |
          git clone --depth 1 --branch v0.10.1 https://github.com/bitcoinj/bitcoinj.git /tmp/bitcoinj
          cd /tmp/bitcoinj
          mvn clean install -DskipTests -q
          cd $GITHUB_WORKSPACE

      - name: Build base + integration-android + wallet
        run: |
          mvn clean install -pl :base,:integration-android,:wallet -am -q

      - name: Kiểm tra file trung gian
        run: |
          echo "=== File trong wallet/target ==="
          ls -la wallet/target/
          echo ""
          echo "=== File .ap_ và classes.dex ==="
          ls -la wallet/target/*.ap_ wallet/target/classes.dex 2>/dev/null || true

      - name: Chuyển về Java 17 (cho apksigner)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Đóng gói APK đầy đủ + ký bằng apksigner
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/33.0.2"
          OLD_BUILD_TOOLS="$ANDROID_HOME/build-tools/26.0.3"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APK_SIGNER="$BUILD_TOOLS/apksigner"
          APK_INPUT="wallet/target/wallet-3.17-test.ap_"
          DEX_FILE="wallet/target/classes.dex"
          CLASSES_DIR="wallet/target/classes"
          UNSIGNED_APK="wallet/target/wallet-3.17-test-unsigned.apk"
          ALIGNED_APK="wallet/target/wallet-3.17-test-aligned.apk"
          SIGNED_APK="wallet/target/wallet-3.17-test.apk"
          
          # 1. Tạo thư mục làm việc
          WORK_DIR="/tmp/apk-build"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          
          # 2. Giải nén file .ap_ (chứa resources + manifest)
          cd "$WORK_DIR"
          unzip -q "$OLDBUILD_TOOLS/../$APK_INPUT" 2>/dev/null || unzip -q "$GITHUB_WORKSPACE/$APK_INPUT"
          
          echo "=== Nội dung file .ap_ ==="
          ls -la "$WORK_DIR/"
          
          # 3. Sao chép classes.dex vào thư mục gốc
          cp "$GITHUB_WORKSPACE/$DEX_FILE" "$WORK_DIR/classes.dex"
          
          # 4. Thêm các thư viện jar cần thiết (giải nén và thêm class files)
          # Tìm tất cả các jar dependency
          DEP_JARS=$(find "$HOME/.m2/repository" -name "*.jar" -type f | grep -E "(bitcoinj|netty|protobuf|guava|scrypt|zxing|slf4j|logback)" | head -20)
          echo ""
          echo "=== Thêm các thư viện dependency ==="
          for jar in $DEP_JARS; do
            echo "  + $(basename $jar)"
            cd "$WORK_DIR" && unzip -q -o "$jar" -d "$WORK_DIR/libs-tmp" 2>/dev/null || true
          done
          
          # Di chuyển class files từ libs-tmp vào thư mục gốc (tránh trùng lặp)
          if [ -d "$WORK_DIR/libs-tmp" ]; then
            cd "$WORK_DIR/libs-tmp"
            find . -name "*.class" -exec cp --parents {} "$WORK_DIR/" \; 2>/dev/null || true
            cd "$WORK_DIR"
            rm -rf libs-tmp
          fi
          
          # 5. Đóng gói lại thành APK (file zip)
          cd "$WORK_DIR"
          zip -qr "$GITHUB_WORKSPACE/$UNSIGNED_APK" .
          
          cd "$GITHUB_WORKSPACE"
          echo ""
          echo "=== APK chưa ký ==="
          ls -la "$UNSIGNED_APK"
          
          # 6. Zipalign
          $ZIPALIGN -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          
          # 7. Tạo debug keystore
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # 8. Ký bằng apksigner (v1 + v2 scheme)
          $APK_SIGNER sign --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          
          # 9. Xác minh
          echo ""
          echo "=== Kết quả cuối cùng ==="
          ls -la "$SIGNED_APK"
          echo ""
          echo "=== Xác minh chữ ký ==="
          $APK_SIGNER verify --verbose "$SIGNED_APK"
          echo ""
          echo "=== Nội dung APK ==="
          $BUILD_TOOLS/aapt list "$SIGNED_APK" | head -30

      - name: Tìm file APK cuối cùng
        run: |
          echo "=== Tìm tất cả file .apk ==="
          find . -name "*.apk" -type f -size +0k

      - name: Lưu APK ra kết quả
        uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Wallet-v3.17-APK
          path: "wallet/target/wallet-3.17-test.apk"
          retention-days: 7
