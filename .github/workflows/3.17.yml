name: Build Bitcoin Wallet v3.17
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SKIP_JDK_VERSION_CHECK: "true"
  ANDROID_HOME: /usr/local/lib/android/sdk

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK v3.17
    runs-on: ubuntu-latest
    steps:
      - name: Lấy toàn bộ mã nguồn
        uses: actions/checkout@v4
        with:
          repository: buli-net/test-B-Wallet
          fetch-depth: 0

      - name: Checkout đúng commit 982c631
        run: git checkout 982c631

      - name: Xác nhận commit hiện tại
        run: git log --oneline -1

      - name: Cài đặt Java 17 (cho sdkmanager)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cài đặt Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "tools" \
            "platform-tools" \
            "build-tools;26.0.3" \
            "platforms;android-26"

      - name: Chuyển về Java 8 (cho biên dịch dự án)
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Tải và cài đặt bitcoinj 0.10.1 vào local Maven repo
        run: |
          # Tải bitcoinj 0.10.1 từ GitHub releases
          wget -q https://github.com/bitcoinj/bitcoinj/releases/download/v0.10.1/bitcoinj-0.10.1.jar -O bitcoinj-0.10.1.jar
          
          # Cài vào local Maven repository với đúng groupId:artifactId:version
          mvn install:install-file \
            -Dfile=bitcoinj-0.10.1.jar \
            -DgroupId=com.google \
            -DartifactId=bitcoinj \
            -Dversion=0.10.1 \
            -Dpackaging=jar

      - name: Biên dịch toàn bộ dự án bằng Maven
        run: mvn clean install --batch-mode --no-transfer-progress

      - name: Tìm file APK đã tạo
        run: |
          echo "=== Tìm tất cả file .apk ==="
          find . -name "*.apk" -type f

      - name: Lưu APK ra kết quả
        uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Wallet-v3.17-APK
          path: "**/*.apk"
          retention-days: 7
