name: Build Bitcoin Wallet v3.17
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SKIP_JDK_VERSION_CHECK: "true"
  ANDROID_HOME: /usr/local/lib/android/sdk
  MAVEN_HOME: /opt/maven-3.0.5
  PATH: /opt/maven-3.0.5/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK v3.17
    runs-on: ubuntu-latest
    steps:
      - name: Lấy toàn bộ mã nguồn
        uses: actions/checkout@v4
        with:
          repository: buli-net/test-B-Wallet
          fetch-depth: 0

      - name: Checkout đúng commit 982c631
        run: git checkout 982c631

      - name: Xác nhận commit hiện tại
        run: git log --oneline -1

      - name: Cài đặt Java 17 (cho sdkmanager)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cài đặt Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "tools" \
            "platform-tools" \
            "build-tools;26.0.3" \
            "platforms;android-26" \
            "platforms;android-10"  # Thêm cho an toàn

      - name: Tạo script apkbuilder giả
        run: |
          cat > $ANDROID_HOME/tools/apkbuilder << 'APKBUILDER_EOF'
          #!/bin/bash
          OUTPUT_APK=""
          while [[ $# -gt 0 ]]; do
            case "$1" in
              /*.apk) OUTPUT_APK="$1"; shift;;
              *) shift;;
            esac
          done
          if [ -n "$OUTPUT_APK" ]; then
            touch "$OUTPUT_APK"
            echo "apkbuilder (fake): created placeholder $OUTPUT_APK" >&2
          fi
          exit 0
          APKBUILDER_EOF
          chmod +x $ANDROID_HOME/tools/apkbuilder

      - name: Chuyển về Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Cài đặt Maven 3.0.5 + cấu hình HTTPS
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.0.5/binaries/apache-maven-3.0.5-bin.tar.gz
          tar -xzf apache-maven-3.0.5-bin.tar.gz -C /opt/
          mv /opt/apache-maven-3.0.5 /opt/maven-3.0.5
          
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <profiles>
              <profile>
                <id>https-central</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>https-central</activeProfile>
            </activeProfiles>
          </settings>
          EOF
          
          mvn --version

      - name: Clone và build bitcoinj 0.10.1
        run: |
          git clone --depth 1 --branch v0.10.1 https://github.com/bitcoinj/bitcoinj.git /tmp/bitcoinj
          cd /tmp/bitcoinj
          mvn clean install -DskipTests -q
          cd $GITHUB_WORKSPACE

      - name: Build base + integration-android + wallet (bỏ qua sample)
        run: |
          # Build các mô-đun cần thiết, bỏ qua sample-integration-android
          mvn clean install -pl :base,:integration-android,:wallet -am -q

      - name: Kiểm tra file trung gian
        run: |
          echo "=== File trong wallet/target ==="
          ls -la wallet/target/
          echo ""
          echo "=== Kiểm tra .ap_ và classes.dex ==="
          ls -la wallet/target/*.ap_ wallet/target/classes.dex 2>/dev/null || true

      - name: Đóng gói APK thủ công bằng aapt
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/26.0.3"
          AAPT="$BUILD_TOOLS/aapt"
          APK_INPUT="wallet/target/wallet-3.17-test.ap_"
          DEX_FILE="wallet/target/classes.dex"
          FINAL_APK="wallet/target/wallet-3.17-test.apk"
          
          if [ ! -f "$APK_INPUT" ]; then
            echo "ERROR: File .ap_ không tồn tại!"
            exit 1
          fi
          if [ ! -f "$DEX_FILE" ]; then
            echo "ERROR: classes.dex không tồn tại!"
            exit 1
          fi
          
          # Sao chép .ap_ thành .apk
          cp "$APK_INPUT" "$FINAL_APK"
          
          # Thêm classes.dex vào APK
          $AAPT add "$FINAL_APK" "$DEX_FILE"
          
          echo ""
          echo "=== Kết quả ==="
          ls -la "$FINAL_APK"
          echo ""
          echo "=== Kiểm tra nội dung APK ==="
          $AAPT list "$FINAL_APK" | head -30

      - name: Tìm file APK cuối cùng
        run: |
          echo "=== Tìm tất cả file .apk ==="
          find . -name "*.apk" -type f -size +0k

      - name: Lưu APK ra kết quả
        uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Wallet-v3.17-APK
          path: "wallet/target/wallet-3.17-test.apk"
          retention-days: 7
