name: Build Bitcoin Wallet v3.17
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SKIP_JDK_VERSION_CHECK: "true"
  ANDROID_HOME: /usr/local/lib/android/sdk
  MAVEN_HOME: /opt/maven-3.0.5
  PATH: /opt/maven-3.0.5/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

on:
  workflow_dispatch

jobs:
  build:
    name: Build APK v3.17
    runs-on: ubuntu-latest
    steps:
      - name: Lấy toàn bộ mã nguồn
        uses: actions/checkout@v4
        with:
          repository: buli-net/test-B-Wallet
          fetch-depth: 0

      - name: Checkout đúng commit 982c631
        run: git checkout 982c631

      - name: Sửa AndroidManifest.xml thêm targetSdkVersion
        run: |
          echo "=== Manifest gốc ==="
          cat wallet/AndroidManifest.xml
          echo ""
          
          if grep -q "<uses-sdk" wallet/AndroidManifest.xml; then
            sed -i 's/<uses-sdk\([^>]*\)>/<uses-sdk\1 android:targetSdkVersion="33">/g' wallet/AndroidManifest.xml
          fi
          
          echo "=== Manifest sau khi sửa ==="
          cat wallet/AndroidManifest.xml

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cài đặt Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "tools" "platform-tools" \
            "build-tools;26.0.3" "build-tools;33.0.2" \
            "platforms;android-14" "platforms;android-26" "platforms;android-33"
          
          rm -rf $ANDROID_HOME/platforms/android-3[4-9]*
          echo "=== Platforms còn lại ==="
          ls $ANDROID_HOME/platforms/

      - name: Tạo script apkbuilder giả
        run: |
          cat > $ANDROID_HOME/tools/apkbuilder << 'APKBUILDER_EOF'
          #!/bin/bash
          OUTPUT_APK=""
          while [[ $# -gt 0 ]]; do
            case "$1" in
              /*.apk) OUTPUT_APK="$1"; shift;;
              *) shift;;
            esac
          done
          [ -n "$OUTPUT_APK" ] && touch "$OUTPUT_APK"
          exit 0
          APKBUILDER_EOF
          chmod +x $ANDROID_HOME/tools/apkbuilder

      - name: Chuyển về Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Cài đặt Maven 3.0.5 + cấu hình HTTPS
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.0.5/binaries/apache-maven-3.0.5-bin.tar.gz
          tar -xzf apache-maven-3.0.5-bin.tar.gz -C /opt
          mv /opt/apache-maven-3.0.5 /opt/maven-3.0.5
          
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
<settings>
  <profiles>
    <profile>
      <id>https-central</id>
      <repositories>
        <repository>
          <id>central</id>
          <url>https://repo.maven.apache.org/maven2</url>
          <releases><enabled>true</enabled></releases>
          <snapshots><enabled>false</enabled></snapshots>
        </repository>
      </repositories>
      <pluginRepositories>
        <pluginRepository>
          <id>central</id>
          <url>https://repo.maven.apache.org/maven2</url>
          <releases><enabled>true</enabled></releases>
          <snapshots><enabled>false</enabled></snapshots>
        </pluginRepository>
      </pluginRepositories>
    </profile>
  </profiles>
  <activeProfiles>
    <activeProfile>https-central</activeProfile>
  </activeProfiles>
</settings>
EOF
          
          mvn --version

      - name: Clone và build bitcoinj 0.10.1
        run: |
          git clone --depth 1 --branch v0.10.1 https://github.com/bitcoinj/bitcoinj.git /tmp/bitcoinj
          cd /tmp/bitcoinj
          git checkout b4a57eb8055a54fd3aab6133835d91d9967d9f98
          mvn clean install -DskipTests -q
          cd $GITHUB_WORKSPACE

      - name: Build base + integration-android + wallet
        run: mvn clean install -pl :base,:integration-android,:wallet -am -q

      - name: Kiểm tra file trung gian
        run: |
          echo "=== File trong wallet/target ==="
          ls -la wallet/target/
          echo ""
          echo "=== classes.dex size ==="
          ls -la wallet/target/classes.dex

      - name: Chuyển về Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Đóng gói + ký ĐÚNG chuẩn – KHÔNG DÙNG APKTOOL
        run: |
          B26="$ANDROID_HOME/build-tools/26.0.3"
          B33="$ANDROID_HOME/build-tools/33.0.2"
          DX="$B26/dx"
          ZIPALIGN="$B33/zipalign"
          SIGNER="$B33/apksigner"
          AAPT="$B33/aapt"
          
          AP_RAW="wallet/target/wallet-3.17-test.ap_"
          CLS_DIR="wallet/target/classes"
          OUT_APK="wallet/target/wallet-3.17-test.apk"
          WORK="/tmp/apk-final"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          
          # 1. Tạo classes.dex hoàn chỉnh
          DEPS=$(find ~/.m2/repository -name "*.jar" | grep -E "(bitcoinj-0\.10\.1\.jar|netty-3\.6\.3|protobuf-java-2\.4\.1|guava-13\.0\.1|scrypt-1\.3\.3|slf4j-api|logback-android)" | grep -v sources | grep -v examples)
          $DX --dex --output="$WORK/classes.dex" "$CLS_DIR" $DEPS
          
          # 2. Giải nén tài nguyên & đóng gói
          cd "$WORK"
          unzip -q "$GITHUB_WORKSPACE/$AP_RAW"
          cp classes.dex .
          zip -qr "$GITHUB_WORKSPACE/unsigned.apk" .
          
          cd "$GITHUB_WORKSPACE"
          $ZIPALIGN -f 4 unsigned.apk aligned.apk
          
          # 3. Tạo keystore & ký đủ chuẩn V1+V2+V3 – KHÔNG HỦY CHỮ KÝ
          keytool -genkey -noprompt -keystore /tmp/debug.ks \
            -storepass android123 -alias debugkey -keypass android123 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Debug,O=Dev,C=VN"
          
          $SIGNER sign --ks /tmp/debug.ks \
            --ks-pass pass:android123 --key-pass pass:android123 \
            --ks-key-alias debugkey \
            --min-sdk-version 9 --max-sdk-version 35 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$OUT_APK" aligned.apk
          
          echo "✅ Kiểm tra chữ ký:"
          $SIGNER verify --verbose "$OUT_APK"
          echo ""
          echo "✅ Kiểm tra targetSdk:"
          $AAPT dump badging "$OUT_APK" | grep -E "sdkVersion|package"

      - name: Tìm file APK cuối cùng
        run: find . -name "*.apk" -type f -size +0k

      - name: Lưu APK ra kết quả
        uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Wallet-v3.17-APK
          path: wallet/target/wallet-3.17-test.apk
          retention-days: 7
