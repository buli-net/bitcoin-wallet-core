name: Build Bitcoin Wallet v3.17

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: buli-net/test-B-Wallet
          fetch-depth: 0

      - name: Checkout commit
        run: git checkout 982c631

      - name: Fix manifest
        run: |
          if grep -q "<uses-sdk" wallet/AndroidManifest.xml; then
            sed -i 's/<uses-sdk\([^>]*\)>/<uses-sdk\1 android:targetSdkVersion="33">/g' wallet/AndroidManifest.xml
          else
            sed -i 's/<\/manifest>/<uses-sdk android:minSdkVersion="9" android:targetSdkVersion="33"\/><\/manifest>/g' wallet/AndroidManifest.xml
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "tools" "platform-tools" \
            "build-tools;26.0.3" "build-tools;33.0.2" \
            "platforms;android-14" "platforms;android-26" "platforms;android-33"
          rm -rf $ANDROID_HOME/platforms/android-3[4-9]*

      - name: Fake apkbuilder
        run: |
          cat > $ANDROID_HOME/tools/apkbuilder << 'EOF'
          #!/bin/bash
          [ -n "$*" ] && touch "${*: -1}"
          exit 0
          EOF
          chmod +x $ANDROID_HOME/tools/apkbuilder

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Install Maven
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.0.5/binaries/apache-maven-3.0.5-bin.tar.gz
          tar -xzf apache-maven-3.0.5-bin.tar.gz -C /opt
          mv /opt/apache-maven-3.0.5 /opt/maven-3.0.5
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
<settings>
  <mirrors>
    <mirror>
      <id>central</id>
      <url>https://repo.maven.apache.org/maven2</url>
      <mirrorOf>central</mirrorOf>
    </mirror>
  </mirrors>
</settings>
EOF

      - name: Build bitcoinj
        run: |
          git clone --depth 1 --branch v0.10.1 https://github.com/bitcoinj/bitcoinj.git /tmp/bitcoinj
          cd /tmp/bitcoinj
          git checkout b4a57eb8055a54fd3aab6133835d91d9967d9f98
          mvn clean install -DskipTests -q

      - name: Build project
        run: mvn clean install -pl :base,:integration-android,:wallet -am -q

      - name: Package & sign
        run: |
          B26=$ANDROID_HOME/build-tools/26.0.3
          B33=$ANDROID_HOME/build-tools/33.0.2
          $B26/dx --dex --output=/tmp/classes.dex wallet/target/classes $(find ~/.m2/repository -name "*.jar" | grep -E "(bitcoinj-0\.10\.1|netty-3\.6\.3|protobuf-java-2\.4\.1|guava-13\.0\.1|scrypt-1\.3\.3|slf4j-api|logback-android)" | grep -v sources)
          mkdir -p /tmp/apk && cd /tmp/apk && unzip -q $GITHUB_WORKSPACE/wallet/target/wallet-3.17-test.ap_ && cp /tmp/classes.dex .
          zip -qr $GITHUB_WORKSPACE/unsigned.apk .
          cd $GITHUB_WORKSPACE
          $B33/zipalign -f 4 unsigned.apk aligned.apk
          keytool -genkey -noprompt -keystore debug.ks -storepass android -alias d -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=D"
          $B33/apksigner sign --ks debug.ks --ks-pass pass:android --key-pass pass:android --ks-key-alias d --v1-signing-enabled true --v2-signing-enabled true --out wallet/target/wallet-3.17-test.apk aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Wallet-v3.17-APK
          path: wallet/target/wallet-3.17-test.apk
          retention-days: 7
