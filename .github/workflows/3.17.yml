name: Build Bitcoin Wallet v3.17
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  SKIP_JDK_VERSION_CHECK: "true"
  ANDROID_HOME: /usr/local/lib/android/sdk
  MAVEN_HOME: /opt/maven-3.0.5
  PATH: /opt/maven-3.0.5/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK v3.17
    runs-on: ubuntu-latest
    steps:
      - name: Lấy toàn bộ mã nguồn
        uses: actions/checkout@v4
        with:
          repository: buli-net/test-B-Wallet
          fetch-depth: 0

      - name: Checkout đúng commit 982c631
        run: git checkout 982c631

      - name: Sửa AndroidManifest.xml thêm targetSdkVersion
        run: |
          echo "=== Manifest gốc ==="
          cat wallet/AndroidManifest.xml
          echo ""
          
          if grep -q "<uses-sdk" wallet/AndroidManifest.xml; then
            sed -i 's/<uses-sdk\([^>]*\)>/<uses-sdk\1 android:targetSdkVersion="26">/g' wallet/AndroidManifest.xml
          fi
          
          echo "=== Manifest sau khi sửa ==="
          cat wallet/AndroidManifest.xml

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Cài đặt Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "tools" \
            "platform-tools" \
            "build-tools;26.0.3" \
            "build-tools;33.0.2" \
            "platforms;android-14" \
            "platforms;android-26" \
            "platforms;android-33"
          
          rm -rf $ANDROID_HOME/platforms/android-3[4-9]*
          echo "=== Platforms còn lại ==="
          ls $ANDROID_HOME/platforms/

      - name: Tạo script apkbuilder giả
        run: |
          cat > $ANDROID_HOME/tools/apkbuilder << 'APKBUILDER_EOF'
          #!/bin/bash
          OUTPUT_APK=""
          while [[ $# -gt 0 ]]; do
            case "$1" in
              /*.apk) OUTPUT_APK="$1"; shift;;
              *) shift;;
            esac
          done
          if [ -n "$OUTPUT_APK" ]; then
            touch "$OUTPUT_APK"
            echo "apkbuilder (fake): created placeholder $OUTPUT_APK" >&2
          fi
          exit 0
          APKBUILDER_EOF
          chmod +x $ANDROID_HOME/tools/apkbuilder

      - name: Chuyển về Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Cài đặt Maven 3.0.5 + cấu hình HTTPS
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.0.5/binaries/apache-maven-3.0.5-bin.tar.gz
          tar -xzf apache-maven-3.0.5-bin.tar.gz -C /opt/
          mv /opt/apache-maven-3.0.5 /opt/maven-3.0.5
          
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <profiles>
              <profile>
                <id>https-central</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>false</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>https-central</activeProfile>
            </activeProfiles>
          </settings>
          EOF
          
          mvn --version

      - name: Clone và build bitcoinj 0.10.1
        run: |
          git clone --depth 1 --branch v0.10.1 https://github.com/bitcoinj/bitcoinj.git /tmp/bitcoinj
          cd /tmp/bitcoinj
          mvn clean install -DskipTests -q
          cd $GITHUB_WORKSPACE

      - name: Build base + integration-android + wallet
        run: |
          mvn clean install -pl :base,:integration-android,:wallet -am -q

      - name: Kiểm tra file trung gian
        run: |
          echo "=== File trong wallet/target ==="
          ls -la wallet/target/
          echo ""
          echo "=== classes.dex size ==="
          ls -la wallet/target/classes.dex
          echo ""
          echo "=== Tìm dependency jars ==="
          find ~/.m2/repository -name "*.jar" -type f | grep -E "(bitcoinj-0\.10\.1|netty|protobuf|guava|scrypt|zxing|slf4j-api|logback)" | grep -v sources | grep -v examples | grep -v tools

      - name: Chuyển về Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Đóng gói APK hoàn chỉnh + ký
        run: |
          BUILD_TOOLS_33="$ANDROID_HOME/build-tools/33.0.2"
          BUILD_TOOLS_26="$ANDROID_HOME/build-tools/26.0.3"
          DX="$BUILD_TOOLS_26/dx"
          ZIPALIGN="$BUILD_TOOLS_33/zipalign"
          APK_SIGNER="$BUILD_TOOLS_33/apksigner"
          AAPT="$BUILD_TOOLS_26/aapt"
          
          APK_INPUT="wallet/target/wallet-3.17-test.ap_"
          CLASSES_DIR="wallet/target/classes"
          UNSIGNED_APK="wallet/target/wallet-3.17-test-unsigned.apk"
          ALIGNED_APK="wallet/target/wallet-3.17-test-aligned.apk"
          SIGNED_APK="wallet/target/wallet-3.17-test.apk"
          
          rm -f "$UNSIGNED_APK" "$ALIGNED_APK" "$SIGNED_APK"
          
          echo "=== Tạo classes.dex hoàn chỉnh ==="
          DX_ARGS="--dex --output=/tmp/classes-complete.dex"
          DX_ARGS="$DX_ARGS $CLASSES_DIR"
          
          DEP_JARS=$(find ~/.m2/repository -name "*.jar" -type f | grep -E "(bitcoinj-0\.10\.1\.jar|netty-3\.6\.3|protobuf-java-2\.4\.1|guava-13\.0\.1|scrypt-1\.3\.3|core-2\.2|slf4j-api-1\.7\.5|logback-android)" | grep -v sources | grep -v examples | grep -v tools)
          
          for jar in $DEP_JARS; do
            echo "  + Thêm: $(basename $jar)"
            DX_ARGS="$DX_ARGS $jar"
          done
          
          $DX $DX_ARGS
          
          echo ""
          echo "=== classes.dex hoàn chỉnh ==="
          ls -la /tmp/classes-complete.dex
          
          WORK_DIR="/tmp/apk-build"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"
          unzip -q "$GITHUB_WORKSPACE/$APK_INPUT"
          
          echo ""
          echo "=== Nội dung file .ap_ ==="
          ls -la "$WORK_DIR/"
          
          cp /tmp/classes-complete.dex "$WORK_DIR/classes.dex"
          
          cd "$WORK_DIR"
          zip -qr "$GITHUB_WORKSPACE/$UNSIGNED_APK" .
          
          cd "$GITHUB_WORKSPACE"
          echo ""
          echo "=== APK chưa ký ==="
          ls -la "$UNSIGNED_APK"
          
          $ZIPALIGN -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          $APK_SIGNER sign --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          
          echo ""
          echo "=== Kết quả cuối cùng ==="
          ls -la "$SIGNED_APK"
          echo ""
          echo "=== Xác minh chữ ký ==="
          $APK_SIGNER verify --verbose "$SIGNED_APK"
          echo ""
          echo "=== Nội dung APK ==="
          $AAPT list "$SIGNED_APK" | head -30

      - name: Cài đặt apktool
        run: |
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          chmod +x /usr/local/bin/apktool.jar

      - name: Nâng targetSdkVersion=33 khắc phục không tương thích
        run: |
          BUILD_TOOLS_33="$ANDROID_HOME/build-tools/33.0.2"
          ZIPALIGN="$BUILD_TOOLS_33/zipalign"
          APK_SIGNER="$BUILD_TOOLS_33/apksigner"
          AAPT="$BUILD_TOOLS_33/aapt"
          
          APK_OLD="wallet/target/wallet-3.17-test.apk"
          APK_NEW="wallet/target/wallet-3.17-test-final.apk"
          DECODED="/tmp/apk-decoded"
          
          # 1. Giải nén APK
          apktool d -f "$APK_OLD" -o "$DECODED"
          
          # 2. Xem nội dung manifest thực tế để hiểu cấu trúc
          echo "=== Nội dung AndroidManifest.xml sau khi giải nén ==="
          cat "$DECODED/AndroidManifest.xml"
          echo ""
          
          # 3. Sửa targetSdkVersion thành 33 - xử lý mọi trường hợp
          # Trường hợp 1: Có thẻ <uses-sdk> riêng
          if grep -q "<uses-sdk" "$DECODED/AndroidManifest.xml"; then
            echo "→ Tìm thấy thẻ <uses-sdk>"
            if grep -q "android:targetSdkVersion" "$DECODED/AndroidManifest.xml"; then
              echo "→ Đã có targetSdkVersion, sửa thành 33"
              sed -i 's/android:targetSdkVersion="[0-9]*"/android:targetSdkVersion="33"/g' "$DECODED/AndroidManifest.xml"
            else
              echo "→ Chưa có targetSdkVersion, thêm vào thẻ uses-sdk"
              sed -i 's/<uses-sdk\([^>]*\)>/<uses-sdk\1 android:targetSdkVersion="33">/g' "$DECODED/AndroidManifest.xml"
            fi
          # Trường hợp 2: Thuộc tính nằm trực tiếp trong thẻ <manifest>
          elif grep -q "android:minSdkVersion" "$DECODED/AndroidManifest.xml"; then
            echo "→ Tìm thấy minSdkVersion trong thẻ manifest"
            if grep -q "android:targetSdkVersion" "$DECODED/AndroidManifest.xml"; then
              sed -i 's/android:targetSdkVersion="[0-9]*"/android:targetSdkVersion="33"/g' "$DECODED/AndroidManifest.xml"
            else
              sed -i 's/android:minSdkVersion="\([0-9]*\)"/android:minSdkVersion="\1" android:targetSdkVersion="33"/g' "$DECODED/AndroidManifest.xml"
            fi
          # Trường hợp 3: Không tìm thấy gì cả, thêm thẻ uses-sdk vào trước </manifest>
          else
            echo "→ Không tìm thấy, thêm thẻ <uses-sdk> mới"
            sed -i 's/<\/manifest>/<uses-sdk android:minSdkVersion="10" android:targetSdkVersion="33"\/><\/manifest>/g' "$DECODED/AndroidManifest.xml"
          fi
          
          echo ""
          echo "=== Manifest sau khi sửa ==="
          cat "$DECODED/AndroidManifest.xml"
          
          # 4. Đóng gói lại
          apktool b -f "$DECODED" -o /tmp/rebuilt.apk
          
          # 5. Zipalign
          $ZIPALIGN -f 4 /tmp/rebuilt.apk /tmp/rebuilt-aligned.apk
          
          # 6. Ký lại
          $APK_SIGNER sign --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out "$APK_NEW" \
            /tmp/rebuilt-aligned.apk
          
          # 7. Thay file cũ
          mv "$APK_NEW" "$APK_OLD"
          
          echo ""
          echo "✅ APK cuối cùng:"
          ls -la "$APK_OLD"
          echo ""
          echo "✅ Xác minh chữ ký:"
          $APK_SIGNER verify --verbose "$APK_OLD"
          echo ""
          echo "✅ Xác minh targetSdkVersion:"
          $AAPT dump badging "$APK_OLD" | grep -i "sdk" || true

      - name: Tìm file APK cuối cùng
        run: |
          echo "=== Tìm tất cả file .apk ==="
          find . -name "*.apk" -type f -size +0k

      - name: Lưu APK ra kết quả
        uses: actions/upload-artifact@v4
        with:
          name: Bitcoin-Wallet-v3.17-APK
          path: "wallet/target/wallet-3.17-test.apk"
          retention-days: 7
